events {}

http {
    server {
        listen 80;
        server_name gsk-kvartal.ru www.gsk-kvartal.ru;
        return 301 https://$host$request_uri;
    }

    server {

        listen 443 ssl;
        server_name gsk-kvartal.ru www.gsk-kvartal.ru;

        ssl_certificate /etc/letsencrypt/live/gsk-kvartal.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gsk-kvartal.ru/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://nextjs:3000;  # Проксируем на Next.js
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~* ^/(.+\.(jpg|jpeg|png|gif|ico|svg|webp))$ {
            root /app/public;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            access_log off;
            try_files /$1 =404;
        }

        # Обработка статических файлов Next.js
        location /_next/static {
            proxy_pass http://nextjs:3000/_next/static;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 365d;
            access_log off;
        }
    }
}
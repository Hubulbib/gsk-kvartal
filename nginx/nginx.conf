user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name gsk-kvartal.ru www.gsk-kvartal.ru;
        return 301 https://$host$request_uri;
    }

    server {

        listen 443 ssl;
        server_name gsk-kvartal.ru www.gsk-kvartal.ru;

        ssl_certificate /etc/letsencrypt/live/gsk-kvartal.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gsk-kvartal.ru/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Резолвим upstream через Docker DNS на каждый запрос, а не один раз при старте,
        # чтобы nginx не падал, если контейнер nextjs временно недоступен
        resolver 127.0.0.11 valid=10s;
        set $nextjs_upstream http://nextjs:3000;

        location / {
            proxy_pass $nextjs_upstream;  # Проксируем на Next.js
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Обработка статических файлов Next.js
        location /_next/static {
            proxy_pass $nextjs_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 365d;
            access_log off;
        }
    }
}